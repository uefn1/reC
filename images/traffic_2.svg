<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D6EAF8"/><stop offset="100%" stop-color="#FEF9E7"/></linearGradient></defs>
<rect width="400" height="400" fill="url(#bg2)"/>
<rect x="0" y="280" width="400" height="120" fill="#6E7B8B"/>
<!-- Two poles -->
<rect x="80" y="50" width="18" height="350" fill="#2C3E50"/><rect x="302" y="50" width="18" height="350" fill="#2C3E50"/>
<rect x="80" y="50" width="240" height="18" fill="#2C3E50"/>
<!-- Left signal -->
<rect x="60" y="70" width="60" height="140" rx="10" fill="#1C2833"/>
<circle cx="90" cy="95" r="18" fill="#E74C3C"/><circle cx="90" cy="95" r="8" fill="#FADBD8" opacity="0.9"/>
<circle cx="90" cy="140" r="18" fill="#5D6D7E" opacity="0.4"/>
<circle cx="90" cy="185" r="18" fill="#27AE60" opacity="0.4"/>
<!-- Right signal -->
<rect x="280" y="70" width="60" height="140" rx="10" fill="#1C2833"/>
<circle cx="310" cy="95" r="18" fill="#E74C3C" opacity="0.3"/>
<circle cx="310" cy="140" r="18" fill="#F39C12" opacity="0.3"/>
<circle cx="310" cy="185" r="18" fill="#2ECC71"/><circle cx="310" cy="185" r="8" fill="#D5F5E3" opacity="0.9"/>
<!-- Crosswalk stripes -->
<rect x="120" y="310" width="160" height="8" fill="white"/><rect x="120" y="330" width="160" height="8" fill="white"/><rect x="120" y="350" width="160" height="8" fill="white"/>
<text x="200" y="300" text-anchor="middle" fill="#2C3E50" font-family="Arial" font-size="14">交差点の信号機</text>
</svg>