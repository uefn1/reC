<circle cx="35" cy="35" r="18" fill="#27AE60"/><circle cx="365" cy="35" r="18" fill="#27AE60"/><circle cx="35" cy="365" r="18" fill="#27AE60"/><circle cx="365" cy="365" r="18" fill="#27AE60"/>
<text x="200" y="45" text-anchor="middle" fill="white" font-family="Arial" font-size="12" opacity="0.6">横断歩道 - 上空から</text>
