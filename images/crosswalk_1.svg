</g>
<!-- Cars -->
<rect x="40" y="130" width="70" height="36" rx="8" fill="#2E86C1"/><rect x="50" y="135" width="30" height="20" fill="#AED6F1"/><circle cx="55" cy="168" r="8" fill="#1A1A1A"/><circle cx="95" cy="168" r="8" fill="#1A1A1A"/>
<rect x="290" y="240" width="70" height="36" rx="8" fill="#E74C3C"/><rect x="300" y="245" width="30" height="20" fill="#FADBD8"/><circle cx="305" cy="278" r="8" fill="#1A1A1A"/><circle cx="345" cy="278" r="8" fill="#1A1A1A"/>
